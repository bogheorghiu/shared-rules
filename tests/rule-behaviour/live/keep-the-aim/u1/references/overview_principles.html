<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boards</title>
<!-- Second high anchor for U1 (synthesis, "Second: U1", item 6). Written from the principles the board
     system's 2026-11-11 UX pass applied, not from overview_good.html:
       1. the owner's moves come first, each showing the ask itself, on the card it belongs to;
       2. zero counts are not printed;
       3. boards with nothing going on recede into one collapsed line;
       4. a card marked as the owner's move with no move written is a quiet "Move not named" flag, not an ask;
       5. stale and opted-out boards are marked in plain words. -->
<style>
  :root {
    --page: #f7f7f4;
    --panel: #ffffff;
    --line: #deded7;
    --line-strong: #bdbdb4;
    --ink: #1d1d1a;
    --ink-2: #5f5f58;
    --ink-3: #85857c;
    --move-edge: #1f5f8b;
    --move-panel: #eef4f9;
    --move-ink: #164a6d;
    --flag-panel: #f4f2ea;
    --flag-ink: #5d5636;
    --done-ink: #3d6a3f;
    --focus-ring: #c2570c;
    --round: 6px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #151513;
      --panel: #1e1e1b;
      --line: #33332e;
      --line-strong: #4b4b44;
      --ink: #ebebe5;
      --ink-2: #a5a59c;
      --ink-3: #7c7c74;
      --move-edge: #79a9d3;
      --move-panel: #1a2631;
      --move-ink: #a9cbea;
      --flag-panel: #29271e;
      --flag-ink: #d6cc9c;
      --done-ink: #9fcf9b;
      --focus-ring: #f0a35e;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
  }
  :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

  .page { max-width: 1180px; margin: 0 auto; padding: 14px 16px 40px; }

  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-bottom: 4px; }
  .head h1 { font-size: 19px; margin: 0; }
  .head .when { font-size: 12px; color: var(--ink-3); }
  .status { margin: 0 0 14px; color: var(--ink-2); overflow-wrap: anywhere; }
  .status strong { color: var(--move-ink); }
  .status .clear { color: var(--done-ink); font-weight: 650; }

  .split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: minmax(0, 1fr); } }

  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 0 0 6px;
  }

  /* 1. moves first, each showing the ask */
  .move-board {
    background: var(--move-panel);
    border-left: 4px solid var(--move-edge);
    border-radius: var(--round);
    padding: 8px 12px;
    margin-bottom: 8px;
  }
  .move-board h3 { font-size: 15px; margin: 0 0 2px; overflow-wrap: anywhere; }
  .move-board h3 small { font-size: 12px; font-weight: 600; color: var(--move-ink); margin-left: 6px; }
  .move-board ol { margin: 0; padding: 0 0 0 20px; }
  .move-board li { padding: 1px 0; overflow-wrap: anywhere; }
  .move-board .ask { font-weight: 600; }
  .move-board .on { color: var(--ink-3); font-size: 12px; }
  .nothing-needed {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--round);
    padding: 10px 12px;
    color: var(--done-ink);
    font-weight: 650;
  }

  /* 4, 5. flags, quiet but plain */
  .flags { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--round); background: var(--panel); }
  .flags li { padding: 6px 10px; border-top: 1px solid var(--line); overflow-wrap: anywhere; font-size: 14px; }
  .flags li:first-child { border-top: 0; }
  .flags .kind {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    background: var(--flag-panel);
    color: var(--flag-ink);
    border-radius: 3px;
    padding: 0 5px;
    margin-right: 6px;
  }
  .flags .detail { display: block; font-size: 12px; color: var(--ink-2); }
  .flags .none { color: var(--ink-3); }

  /* everything else: compact rows, zeros left out */
  .rest { margin-top: 18px; }
  .rest input[type="search"] {
    font: inherit;
    font-size: 14px;
    padding: 4px 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--round);
    background: var(--panel);
    color: var(--ink);
    width: 100%;
    max-width: 300px;
    margin-bottom: 8px;
  }
  .rows { list-style: none; margin: 0 0 10px; padding: 0; columns: 3 240px; column-gap: 16px; }
  .rows li {
    break-inside: avoid;
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
  .rows .n { color: var(--ink-2); font-size: 12px; margin-left: 6px; }

  /* 3. quiet boards recede */
  details.calm { color: var(--ink-3); font-size: 13px; }
  details.calm summary { cursor: pointer; }
  details.calm p { margin: 4px 0 0; overflow-wrap: anywhere; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .foot { margin-top: 28px; font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>Boards</h1><span class="when" id="when"></span></div>
  <p class="status" id="status"></p>

  <div class="split" id="split">
    <section aria-labelledby="moves-label">
      <h2 class="label" id="moves-label">Your moves</h2>
      <div id="moves"></div>
    </section>
    <section aria-labelledby="flags-label">
      <h2 class="label" id="flags-label">Flagged</h2>
      <ul class="flags" id="flags"></ul>
    </section>
  </div>

  <section class="rest" id="rest" aria-labelledby="rest-label">
    <h2 class="label" id="rest-label">Going on</h2>
    <label class="visually-hidden" for="find">Find a board</label>
    <input type="search" id="find" placeholder="Find a board" autocomplete="off">
    <ul class="rows" id="rows"></ul>
    <details class="calm" id="calm"><summary id="calm-summary"></summary><p id="calm-names"></p></details>
  </section>

  <p class="foot">Data: data/boards.js</p>
</div>

<script src="../data/boards.js"></script>
<script>
(function () {
  "use strict";

  function make(tag, cls, text) {  // text only through textContent
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  var DATA = window.BOARD_DATA || {};
  var BOARDS = Array.isArray(DATA.boards) ? DATA.boards : [];
  var STALE_AFTER = 21;  // days without activity
  var NOW = Date.parse(DATA.generated);
  if (isNaN(NOW)) NOW = Date.now();

  function count(n, word, words) { return n + " " + (n === 1 ? word : words); }
  function idle(b) {
    var t = Date.parse(b.last_activity);
    return isNaN(t) ? null : Math.floor((NOW - t) / 86400000);
  }
  function day(iso) { var t = new Date(iso); return isNaN(t.getTime()) ? "unknown" : t.toISOString().slice(0, 10); }
  function shares(b) { return Array.isArray(b.cards); }
  function moves(b) { return shares(b) ? b.cards.filter(function (c) { return c.owner && c.ask; }) : []; }
  function unnamed(b) { return shares(b) ? b.cards.filter(function (c) { return c.owner && !c.ask; }) : []; }
  function stale(b) { var d = idle(b); return d === null || d > STALE_AFTER; }
  function nonzero(c) {  // principle 2: only the numbers that say something
    c = c || {};
    var out = [];
    if (c.open) out.push(c.open + " open");
    if (c.doing) out.push(c.doing + " in progress");
    if (c.questions) out.push(count(c.questions, "question", "questions"));
    return out.join(", ");
  }
  function own(node, b) { node.setAttribute("data-board-id", b.id); return node; }

  var homed = {};  // each board id goes on exactly one element
  function home(node, b) {
    if (homed[b.id]) return node;
    homed[b.id] = true;
    return own(node, b);
  }

  function flag(kind, name, detail, b) {
    var li = make("li");
    if (b) home(li, b);
    var k = make("span", "kind", kind);
    if (kind === "Move not named") k.setAttribute("data-flag", "move-not-named");
    li.appendChild(k);
    li.appendChild(make("b", null, name));
    li.appendChild(make("span", "detail", detail));
    return li;
  }

  function render() {
    document.getElementById("when").textContent = "as of " + day(DATA.generated);
    var status = document.getElementById("status");
    if (!BOARDS.length) {
      document.getElementById("split").hidden = true;
      document.getElementById("rest").hidden = true;
      status.textContent = "No boards are registered yet.";
      return;
    }

    var movesRoot = document.getElementById("moves"), flagsRoot = document.getElementById("flags");
    var rows = document.getElementById("rows"), calm = [];
    var nMoves = 0, nFlags = 0;

    BOARDS.forEach(function (b) {
      var m = moves(b);
      if (!m.length) return;
      nMoves += m.length;
      var box = home(make("article", "move-board"), b);
      var h = make("h3", null, b.title);
      h.appendChild(make("small", null, count(m.length, "move", "moves")));
      box.appendChild(h);
      var ol = make("ol");
      m.forEach(function (c) {
        var li = make("li");
        li.appendChild(make("span", "ask", c.ask));
        li.appendChild(document.createTextNode(" "));
        li.appendChild(make("span", "on", c.title));
        ol.appendChild(li);
      });
      box.appendChild(ol);
      movesRoot.appendChild(box);
    });
    if (!nMoves) movesRoot.appendChild(make("p", "nothing-needed", "Nothing needs you right now."));

    BOARDS.forEach(function (b) {
      unnamed(b).forEach(function (c) {
        nFlags += 1;
        flagsRoot.appendChild(flag("Move not named", b.title,
          c.title + " is marked as your move, but nobody wrote what the move is.", b));
      });
      if (!shares(b)) {
        nFlags += 1;
        var nz = nonzero(b.counts);
        flagsRoot.appendChild(flag("Not sharing cards", b.title,
          "Only counts are known" + (nz ? ": " + nz : "") + ".", b));
      } else if (stale(b)) {
        nFlags += 1;
        var d = idle(b);
        flagsRoot.appendChild(flag("Stale", b.title,
          d === null ? "No activity recorded." : "Nothing has happened for " + d + " days (since " + day(b.last_activity) + ").", b));
      }
    });
    if (!nFlags) flagsRoot.appendChild(make("li", "none", "No flags."));

    BOARDS.forEach(function (b) {
      if (homed[b.id]) return;
      var nz = nonzero(b.counts);
      if (!nz) { calm.push(b); return; }
      var li = home(make("li"), b);
      li.appendChild(make("span", null, b.title));
      li.appendChild(make("span", "n", nz));
      li.setAttribute("data-find", String(b.title).toLowerCase());
      rows.appendChild(li);
    });

    var calmBox = document.getElementById("calm"), names = document.getElementById("calm-names");
    calmBox.hidden = !calm.length;
    document.getElementById("calm-summary").textContent = count(calm.length, "quiet board", "quiet boards") + ", nothing open";
    calm.forEach(function (b, i) {
      if (i) names.appendChild(document.createTextNode(" · "));
      var s = home(make("span", null, b.title), b);
      s.setAttribute("data-find", String(b.title).toLowerCase());
      names.appendChild(s);
    });

    if (nMoves) {
      var nb = movesRoot.querySelectorAll(".move-board").length;
      status.appendChild(make("strong", null, count(nMoves, "move", "moves") + " waiting for you"));
      status.appendChild(document.createTextNode(" on " + count(nb, "board", "boards")));
    } else {
      status.appendChild(make("span", "clear", "Nothing needs you right now"));
    }
    status.appendChild(document.createTextNode(" · " + count(nFlags, "flag", "flags") + " · " + BOARDS.length + " boards"));
  }

  document.getElementById("find").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#rest [data-find]").forEach(function (n) {
      n.hidden = !!q && n.getAttribute("data-find").indexOf(q) === -1;
    });
    if (q) document.getElementById("calm").open = true;
  });

  render();
})();
</script>
</body>
</html>
