<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boards overview</title>
<style>
  /* Colour tokens. Every colour on this page comes from here. */
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --border: #dcdcd5;
    --text: #1f1f1c;
    --text-muted: #66665e;
    --text-faint: #8a8a80;
    --accent: #2f5d8a;
    --focus: #c2570c;
    --radius: 6px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #1f1f1c;
      --border: #34342f;
      --text: #ecece6;
      --text-muted: #a3a39a;
      --text-faint: #7d7d75;
      --accent: #7fa8d1;
      --focus: #f0a35e;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  .meta { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }

  ul.boards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .board {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    min-width: 0;
  }
  .board h2 { font-size: 16px; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .board .state { margin: 2px 0 0; overflow-wrap: anywhere; }
  .board .when { margin: 2px 0 0; font-size: 12px; color: var(--text-faint); }
  .empty { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Boards overview</h1>
    <p class="meta" id="meta"></p>
  </header>
  <main>
    <ul class="boards" id="boards" aria-label="Boards"></ul>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
