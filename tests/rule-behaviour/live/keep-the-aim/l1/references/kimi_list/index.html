<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boards overview</title>
<style>
  /* Colour tokens. Every colour on this page comes from here. */
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --border: #dcdcd5;
    --text: #1f1f1c;
    --text-muted: #66665e;
    --text-faint: #8a8a80;
    --accent: #2f5d8a;
    --accent-soft: #e9eff5;
    --accent-border: #b8c9d9;
    --focus: #c2570c;
    --radius: 6px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #1f1f1c;
      --border: #34342f;
      --text: #ecece6;
      --text-muted: #a3a39a;
      --text-faint: #7d7d75;
      --accent: #7fa8d1;
      --accent-soft: #24313d;
      --accent-border: #415a70;
      --focus: #f0a35e;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .wrap { max-width: 840px; margin: 0 auto; padding: 20px 14px 48px; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  .meta { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }

  .summary {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius);
    margin: 0 0 22px;
    padding: 12px 14px;
  }
  .summary h2 { font-size: 13px; margin: 0 0 3px; font-weight: 700; color: var(--accent); }
  .summary p { margin: 0; overflow-wrap: anywhere; }

  .section-heading { margin: 0 0 10px; }
  .section-heading h2 { font-size: 18px; margin: 0; font-weight: 650; }
  .order-note { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; }

  ul.boards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .board {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    min-width: 0;
  }
  .board.needs-you { border-color: var(--accent-border); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .badge {
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.3;
    padding: 3px 7px;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .badge.needs { background: var(--accent-soft); color: var(--accent); }
  .badge.holds { background: var(--bg); color: var(--text-muted); }
  .board h3 { font-size: 17px; margin: 0; font-weight: 650; overflow-wrap: anywhere; }
  .board .state { margin: 4px 0 0; overflow-wrap: anywhere; }
  .board.needs-you .state { color: var(--accent); }
  .board .when { margin: 3px 0 0; font-size: 12px; color: var(--text-faint); overflow-wrap: anywhere; }

  .impact {
    background: var(--bg);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-size: 13px;
    margin: 10px 0 0;
    padding: 8px 10px;
    overflow-wrap: anywhere;
  }
  .dependencies { border-top: 1px solid var(--border); margin-top: 11px; padding-top: 9px; }
  .dependencies h4 { color: var(--text-muted); font-size: 12px; margin: 0 0 5px; font-weight: 700; }
  ul.connections { list-style: none; margin: 0; padding: 0; }
  .connection { font-size: 14px; overflow-wrap: anywhere; }
  .connection + .connection { margin-top: 7px; }
  .empty { color: var(--text-muted); }

  @media (min-width: 700px) {
    .wrap { padding: 28px 20px 56px; }
    .board { padding: 15px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Boards overview</h1>
    <p class="meta" id="meta" aria-live="polite">Loading boards…</p>
  </header>
  <main>
    <section class="summary" id="summary" aria-labelledby="summary-title" hidden>
      <h2 id="summary-title">At a glance</h2>
      <p id="summary-text"></p>
    </section>
    <section aria-labelledby="boards-title">
      <div class="section-heading">
        <h2 id="boards-title">Boards</h2>
        <p class="order-note">Needs your input first, then the biggest blockers. Dependencies are written out in full.</p>
      </div>
      <ul class="boards" id="boards" aria-label="Boards, in priority order"></ul>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
