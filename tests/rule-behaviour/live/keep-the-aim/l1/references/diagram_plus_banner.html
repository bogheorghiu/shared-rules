<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boards overview</title>
<!-- L1 narrow-fix anchor: the literal diagram (literal_diagram.html) plus a "Your move" banner at the top
     listing the owner asks in registry order. Nothing else changes. -->
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --border: #dcdcd5;
    --text: #1f1f1c;
    --text-muted: #66665e;
    --text-faint: #8a8a80;
    --line: #8a9bb0;
    --move-bg: #fdf1e6;
    --move-border: #e2a46f;
    --focus: #c2570c;
    --radius: 6px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #1f1f1c;
      --border: #34342f;
      --text: #ecece6;
      --text-muted: #a3a39a;
      --text-faint: #7d7d75;
      --line: #5d6b7c;
      --move-bg: #33261a;
      --move-border: #8a5a30;
      --focus: #f0a35e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { padding: 16px 16px 32px; }
  header { margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  .meta { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; }

  .canvas {
    position: relative;
    height: 760px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    touch-action: none;
  }
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.edges line { stroke: var(--line); stroke-width: 1.5; }
  svg.edges .arrow { fill: var(--line); }
  .card {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 132px;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: grab;
    user-select: none;
    font-size: 13px;
  }
  .card.dragging { cursor: grabbing; }
  .card b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .card span { display: block; font-size: 11px; color: var(--text-faint); }
  .empty { padding: 24px; color: var(--text-muted); }
  .banner {
    background: var(--move-bg);
    border: 1px solid var(--move-border);
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 10px;
  }
  .banner h2 { font-size: 15px; margin: 0 0 4px; }
  .banner ul { margin: 0; padding-left: 18px; }
  .banner li { overflow-wrap: anywhere; }
  .banner[hidden] { display: none; }
  @media (max-width: 640px) {
    .canvas { height: 640px; }
    .card { width: 96px; font-size: 11px; padding: 4px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Boards</h1>
    <p class="meta" id="meta"></p>
  </header>
  <section class="banner" id="your-move" aria-label="Your move" hidden>
    <h2>Your move</h2>
    <ul id="asks"></ul>
  </section>
  <main class="canvas" id="canvas">
    <svg class="edges" id="edges" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="arrow" d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
    </svg>
  </main>
</div>
<script>
(function () {
  "use strict";
  var KEY = "connections:positions";
  var SVG = "http://www.w3.org/2000/svg";
  var canvas = document.getElementById("canvas");
  var svg = document.getElementById("edges");
  var pos = {}, cards = {}, links = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(pos)); } catch (e) { /* not kept */ } }

  function place(id) {
    cards[id].style.left = (pos[id].x * 100) + "%";
    cards[id].style.top = (pos[id].y * 100) + "%";
  }

  function draw() {
    Array.prototype.slice.call(svg.querySelectorAll("line")).forEach(function (l) { l.remove(); });
    var w = canvas.clientWidth, h = canvas.clientHeight;
    links.forEach(function (l) {
      if (!pos[l.from] || !pos[l.to]) return;
      var x1 = pos[l.from].x * w, y1 = pos[l.from].y * h, x2 = pos[l.to].x * w, y2 = pos[l.to].y * h;
      // the arrow stops at the edge of the card it points to
      var dx = x2 - x1, dy = y2 - y1, hw = cards[l.to].offsetWidth / 2 + 3, hh = cards[l.to].offsetHeight / 2 + 3;
      var s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity, 1);
      var line = document.createElementNS(SVG, "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2 - dx * s); line.setAttribute("y2", y2 - dy * s);
      line.setAttribute("marker-end", "url(#arrow)");
      line.setAttribute("data-from", l.from); line.setAttribute("data-to", l.to);
      svg.appendChild(line);
    });
  }

  function drag(card, id) {
    var start = null;
    card.addEventListener("pointerdown", function (e) {
      start = {x: e.clientX, y: e.clientY, moved: false};
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener("pointermove", function (e) {
      if (!start) return;
      if (!start.moved && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 4) return;
      start.moved = true;
      card.classList.add("dragging");
      var r = canvas.getBoundingClientRect();
      pos[id] = {x: Math.min(0.95, Math.max(0.05, (e.clientX - r.left) / r.width)),
                 y: Math.min(0.95, Math.max(0.05, (e.clientY - r.top) / r.height))};
      place(id);
      draw();
    });
    function end() {
      if (start && start.moved) save();
      start = null;
      card.classList.remove("dragging");
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  function render(data) {
    var boards = Array.isArray(data.boards) ? data.boards : [];
    links = Array.isArray(data.links) ? data.links : [];
    document.getElementById("meta").textContent =
      boards.length + " boards · " + links.length + " connections · drag a card to move it";
    var asks = boards.filter(function (b) { return b.ask; });
    asks.forEach(function (b) {
      var li = el("li");
      li.appendChild(el("b", null, b.title));
      li.appendChild(document.createTextNode(": " + b.ask));
      document.getElementById("asks").appendChild(li);
    });
    document.getElementById("your-move").hidden = !asks.length;
    if (!boards.length) { canvas.appendChild(el("p", "empty", "No boards yet.")); return; }
    var saved = load();
    boards.forEach(function (b, i) {
      var a = (i / boards.length) * 2 * Math.PI - Math.PI / 2;
      pos[b.id] = saved[b.id] || {x: 0.5 + 0.42 * Math.cos(a), y: 0.5 + 0.42 * Math.sin(a)};
      var card = el("div", "card");
      card.setAttribute("data-board-id", b.id);
      card.tabIndex = 0;
      card.appendChild(el("b", null, b.title));
      card.appendChild(el("span", null, "active " + String(b.last_activity || "").slice(0, 10)));
      cards[b.id] = card;
      canvas.appendChild(card);
      place(b.id);
      drag(card, b.id);
    });
    draw();
    window.addEventListener("resize", draw);
  }

  fetch("../data/boards.json").then(function (r) { return r.json(); }).then(render).catch(function () {
    document.getElementById("meta").textContent = "Could not load ../data/boards.json.";
  });
})();
</script>
</body>
</html>
